<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Vanilla World Clock</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <header>
        <h1>World Clock</h1>
        <select name="city-select">
          <option value="" hidden>--Please choose a city--</option>
          <option value="">My location</option>
          <option value="">Dublin</option>
          <option value="">Los Angeles</option>
          <option value="">Tokyo</option>
        </select>
      </header>
      <main>
        <div class="city">
          <h2>London</h2>
          <div class="date">August 31 2026</div>
          <div class="time">11:47:23</div>
        </div>
        <div class="city">
          <h2>New York City</h2>
          <div class="date">August 31 2026</div>
          <div class="time">11:47:23</div>
        </div>
        <div class="city">
          <h2>Sydney</h2>
          <div class="date">August 31 2026</div>
          <div class="time">11:47:23</div>
        </div>
      </main>
      <footer>
        This project was coded by <a href="#">Martina Scibilia</a>, versioned on
        <a href="#">GitHub</a> and hosted on <a href="#">Netlify</a>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
