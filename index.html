<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Vanilla World Clock</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <header>
        <h1>World Clock</h1>
        <select id="city-select">
          <option value="" hidden>Please choose a city</option>
          <option value="current">My location</option>
          <option value="Europe/Dublin">Dublin</option>
          <option value="America/Los_Angeles">Los Angeles</option>
          <option value="Asia/Tokyo">Tokyo</option>
        </select>
      </header>
      <main id="selected-city-container">
        <div id="default-cities-container"></div>
      </main>
      <footer>
        This project was coded by
        <a href="https://github.com/masci-hub" target="_blank"
          >Martina Scibilia</a
        >, versioned on
        <a
          href="https://github.com/masci-hub/vanilla-world-clock"
          target="_blank"
          >GitHub</a
        >, and hosted on
        <a
          href="https://vanilla-world-clock-project.netlify.app/"
          target="_blank"
          >Netlify</a
        >
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
